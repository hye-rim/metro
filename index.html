<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>지하철 노선 연결</title>
<style>
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#f1ece0; color:#222; touch-action:none;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  #stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#2b2b33; }
  #wrap { position:relative; background:#f4efe3; }
  #game { display:block; touch-action:none; border-radius:8px; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:15%; z-index:5; display:flex; gap:8px; align-items:center; justify-content:center; padding:0 10px; background:#e4dcc9; border-top:2px solid #cfc5ad; border-radius:0 0 8px 8px; }
  #bar.hidden { display:none; }
  #bar button { flex:1; height:74%; border-radius:14px; font-size:15px; font-weight:900; color:#fff; border:3px solid transparent; cursor:pointer; touch-action:none; box-shadow:0 3px 0 rgba(0,0,0,.25); }
  #bar button small { display:block; font-size:10px; font-weight:700; opacity:.9; }
  #bar .ln.on { border-color:#222; transform:translateY(2px); box-shadow:none; }
  #btnL0 { background:#e5484d; } #btnL1 { background:#3b82f6; } #btnL2 { background:#22a55b; }
  #btnTrain { background:#6b5b95; flex:1.2; } #btnTrain:disabled { opacity:.4; }
  #btnDel { background:#8a8a8a; flex:.8; }
  #top { position:absolute; right:6px; top:6px; display:flex; gap:6px; z-index:7; }
  #top button { position:relative; background:rgba(255,255,255,.8); border:1px solid rgba(0,0,0,.25); width:32px; height:32px; border-radius:8px; font-size:14px; cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-6px -3px; }
  #overlay { position:absolute; inset:0; z-index:6; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:14px; background:rgba(244,239,227,.94); border-radius:8px; }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:38px; font-weight:900; color:#d23b40; line-height:1.15; }
  #overlay h2 { font-size:26px; font-weight:900; }
  #overlay p { font-size:13px; color:#333; line-height:1.6; }
  #overlay .big { font-size:30px; letter-spacing:3px; }
  #overlay .help { font-size:12px; color:#666; line-height:1.7; }
  #overlay .note { font-size:11px; color:#777; }
  #overlay button { margin-top:6px; background:#d23b40; color:#fff; font-weight:900; font-size:17px; border:none; border-radius:999px; padding:12px 30px; box-shadow:0 4px 0 #8e2226; cursor:pointer; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #8e2226; }
  #overlay .lv { display:flex; gap:10px; margin-top:6px; }
  #overlay .lv button { margin-top:0; padding:10px 18px; font-size:16px; }
  #overlay .lv small { display:block; font-size:10px; font-weight:600; opacity:.85; margin-top:2px; }
  .pc { display:inline; } .touch { display:none; }
  @media (pointer:coarse) { .pc { display:none; } .touch { display:inline; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game" width="360" height="640"></canvas>
    <div id="top"><button id="muteBtn" title="소리 (M)">🔊</button></div>
    <div id="bar" class="hidden"><button class="ln on" id="btnL0">1호선</button><button class="ln" id="btnL1">2호선</button><button class="ln" id="btnL2">3호선</button><button id="btnTrain">🚆 열차 +<small id="spareN">0</small></button><button id="btnDel">선 지우기</button></div>
    <div id="overlay"></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
